[workspace]
resolver = "2"
members = [
    "crates/strata-core",
    "crates/strata-cli",
    "crates/strata-server",
    "crates/strata-tui",
    "crates/strata-egui",
    "crates/strata-desktop",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jaroslavpachola/strata"

[profile.release]
lto = "thin"
strip = true

[workspace.dependencies]
strata-core = { path = "crates/strata-core" }
strata-server = { path = "crates/strata-server" }
strata-egui = { path = "crates/strata-egui" }
# SQLCipher compiled in, linked against the system libcrypto: the vault
# is a SQLCipher file and open.db is plain SQLite through the same build
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# UUIDv7: ids that sort by creation time, ready for sync later
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# the vault passphrase from the terminal, echo off, even with stdin piped
rpassword = "7"
toml = "1"
# the server: HTTP over a Unix socket, and a blocking client for it
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
# vault types leave the store only inside an age file
age = "0.12"
# the TUI, on the ratatui rcmd uses
ratatui = "0.29"
# the egui Plocha and rcmd-egui use: the widgets must fit Plocha's panes
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui_kittest = "0.36"
# strata links asks a SuperHub hub for the notes that link here
ureq = { version = "3", default-features = false, features = ["rustls"] }
tempfile = "3"
