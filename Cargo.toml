[workspace]
resolver = "2"
members = [
    "crates/strata-core",
    "crates/strata-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jaroslavpachola/strata"

[profile.release]
lto = "thin"
strip = true

[workspace.dependencies]
strata-core = { path = "crates/strata-core" }
# SQLCipher compiled in, linked against the system libcrypto: the vault
# is a SQLCipher file and open.db is plain SQLite through the same build
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# UUIDv7: ids that sort by creation time, ready for sync later
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# the vault passphrase from the terminal, echo off, even with stdin piped
rpassword = "7"
toml = "1"
tempfile = "3"
